apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: shopeasy-ingress
  namespace: shopeasy

spec:
  ingressClassName: nginx

  rules:
  - http:
      paths:

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: shopeasy-backend
            port:
              number: 5000

      - path: /
        pathType: Prefix
        backend:
          service:
            name: shopeasy-frontend
            port:
              number: 80