apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopeasy-frontend
  namespace: shopeasy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopeasy-frontend
  template:
    metadata:
      labels:
        app: shopeasy-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB_USERNAME/shopeasy-frontend:1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
