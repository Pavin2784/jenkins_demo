apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopeasy-backend
  namespace: shopeasy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopeasy-backend
  template:
    metadata:
      labels:
        app: shopeasy-backend
    spec:
      containers:
        - name: backend
          image: pavinb/shopeasy-backend:13
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shopeasy-backend-config
                  key: PORT
            - name: DB_HOST
              value: shopeasy-postgres
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: shopeasy-db-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopeasy-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopeasy-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
